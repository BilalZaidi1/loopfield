# Manual backend deployment to the staging Supabase project. Protect the `staging` environment with
# required reviewers (Settings > Environments) so every run is approved by a person.
#
# Environment secrets: SUPABASE_ACCESS_TOKEN (scoped: database_write, edge_functions_write, secrets_write),
#                      SUPABASE_DB_PASSWORD
# Environment variable: SUPABASE_PROJECT_REF
# Function secrets are NOT set from CI: they are entered once per project with `scripts/setup-supabase.sh secrets`
# (or in the dashboard), so provider keys never pass through workflow logs.
name: Deploy backend (staging)
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply pending migrations
        type: boolean
        default: true
      functions:
        description: Deploy edge functions
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Supabase CLI (pinned)
        run: npm install -g --no-audit --no-fund supabase@3.0.0
      - name: Refuse unexpected targets
        run: |
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is not set for the staging environment"; exit 1; }
      - name: Link
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Pending migrations
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: inputs.migrate
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --skip-vault --yes
      - name: Deploy edge functions
        if: inputs.functions
        run: supabase functions deploy --no-verify-jwt --use-api --yes
