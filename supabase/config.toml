# Supabase CLI configuration (local stack: `supabase start`; remote: link with `supabase link`).
project_id = "loopfield"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "loopfield://"
additional_redirect_urls = ["loopfield://**", "exp+loopfield://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Single auth-email path: the Send Email Hook delivers through Resend. SMTP is intentionally not configured,
# so no auth email is ever sent twice.
[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:54321/functions/v1/auth-email-hook"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[storage]
enabled = true
file_size_limit = "10MiB"

# Every function verifies its own credentials (user session, webhook signature or shared secret), and all
# share one import map (supabase/functions/deno.json, also used by `deno check`).
[functions.session-ticket]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.activity-upload]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.chat]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.account]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.billing-sync]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.stream-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.revenuecat-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.resend-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.auth-email-hook]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.jobs]
verify_jwt = false
import_map = "./functions/deno.json"
